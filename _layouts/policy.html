<!doctype html>
<html lang="{{ page.lang | default: 'en' }}" dir="{{ page.text_direction | default: 'ltr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <link rel="alternate" hreflang="{{ page.alternate_lang }}" href="{{ page.alternate_path }}">
  <style>
    :root {
      color-scheme: light dark;
      --brand: #00875a;
      --text: #151515;
      --muted: #6b7280;
      --bg: #f7f8f7;
      --card: #ffffff;
      --border: #e5e7eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f5f5f5;
        --muted: #a1a1aa;
        --bg: #111311;
        --card: #1a1d1a;
        --border: #2a2f2a;
      }
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }

    html[dir="rtl"] body {
      font-family: "SF Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
      line-height: 1.75;
      letter-spacing: 0;
    }

    main {
      max-width: 920px;
      margin-inline: auto;
      padding-block: 32px 56px;
      padding-inline: 18px;
    }

    article {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      text-align: start;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      margin-block-end: 28px;
    }

    nav a {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding-block: 8px;
      padding-inline: 14px;
      text-decoration: none;
      background: color-mix(in srgb, var(--brand) 8%, transparent);
    }

    h1, h2 {
      line-height: 1.25;
    }

    h1 {
      color: var(--brand);
      font-size: clamp(2rem, 5vw, 3.4rem);
      margin-block: 0 8px;
    }

    h2 {
      margin-block-start: 32px;
      font-size: 1.35rem;
    }

    p, li {
      font-size: 1rem;
    }

    a {
      color: var(--brand);
      overflow-wrap: anywhere;
    }

    a[href^="mailto:"] {
      direction: ltr;
      unicode-bidi: isolate;
    }
  </style>
</head>
<body>
  <main>
    <article>
      <nav aria-label="{{ page.language_navigation_label }}">
        <a href="../">{{ page.home_label }}</a>
        <a href="{{ page.alternate_path }}" hreflang="{{ page.alternate_lang }}">{{ page.alternate_label }}</a>
      </nav>
      {{ content }}
    </article>
  </main>
</body>
</html>
